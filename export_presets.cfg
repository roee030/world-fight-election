[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="output/imagegen/*,assets/characters/*-concept.png"
export_path="export/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<style>html,body{width:100%;height:100%;min-height:100dvh;margin:0;overflow:hidden;background:#050810;overscroll-behavior:none}body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}#canvas{display:block;width:100%!important;height:100%!important;touch-action:none}#phone-orientation{display:none}@media (orientation:portrait) and (max-width:700px){#phone-orientation{position:fixed;z-index:9999;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;color:#f7f2e8;background:radial-gradient(circle at 50% 35%,#183344,#050810 68%);font-family:Arial,sans-serif}#phone-orientation strong{font-size:28px;letter-spacing:2px}#phone-orientation span{font-size:17px;color:#bed0d7;line-height:1.5}#phone-orientation button{min-width:230px;padding:16px 22px;border:1px solid #65ddd5;border-radius:5px;background:#163b45;color:white;font-size:17px;font-weight:700}}</style>\n<script>addEventListener('DOMContentLoaded',()=>{const gate=document.createElement('div');gate.id='phone-orientation';gate.innerHTML='<strong>ROTATE TO FIGHT</strong><span>סובבו את הטלפון לרוחב<br>Turn your phone sideways for the full game and controls.</span><button>FULL SCREEN / מסך מלא</button>';gate.querySelector('button').onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(e){}};document.body.appendChild(gate)})</script>"
html/canvas_resize_policy=2
html/focus_canvas=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
